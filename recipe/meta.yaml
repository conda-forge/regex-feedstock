{% set name = "regex" %}
{% set version = "2026.11.23" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/33/ad/49412041262da587f74bdd0025ccf951efed14b5857ef1d6385298923a83/regex-{{ version }}.tar.gz
  sha256: f933202c64dca184b783e1c97922170bb167146faa120476a310e90d0701a915

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools >77.0.3
    - pip
  run:
    - python

test:
  imports:
    - regex
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mrabarnett/mrab-regex
  license: Apache-2.0 AND CNRI-Python
  license_file: LICENSE.txt
  license_family: PSF
  summary: Alternative regular expression module, to replace re

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
    - xhochy
