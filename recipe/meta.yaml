{% set name = "regex" %}
{% set version = "2026.11.18" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/33/45/792b86c989c23c26031f758c7f3c4b578689b43936e96d86e59757e9410a/regex-{{ version }}.tar.gz
  sha256: a408377998ab0fad811772c683ccbf6f4a0365a35a23b4fb2b2c67a8d8283b93

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools >77.0.3
    - pip
  run:
    - python

test:
  imports:
    - regex
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mrabarnett/mrab-regex
  license: Apache-2.0 AND CNRI-Python
  license_file: LICENSE.txt
  license_family: PSF
  summary: Alternative regular expression module, to replace re

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
    - xhochy
